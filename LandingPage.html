<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> NightFeather </title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="Landing Page Assets/Brand Logo(Black).png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Figtree:ital,wght@0,300..900;1,300..900&family=Gantari:ital,wght@0,100..900;1,100..900&family=Hurricane&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="Containers">
        <div class="Intro-Section">
            <img src="Landing Page Assets/coffee_beans.png" alt="Coffee-beans" class="Coffee-beans">
            <div class="Logo-and-Text">
                  <img src="Landing Page Assets/Brand Logo (White).png" alt="NightFeather Logo" class="Logo">
                  <p> <b> Artisan coffee, expertly roasted, </b> <br> 
                    served fresh every morning. </p>
            </div> 

        
        <div class="feedback-1">
            <img src="Landing Page Assets/feedback(1).png" alt="customer review">
            <img src="Landing Page Assets/feedback(2).png" alt="customer review">
        </div>

        <div class="description-and-button">
            <h6> <i> Loved by 1k+ coffee enthusiasts! </i> </h6>
            <button> Get your discounted coffee here. </button>
            <h6> or <br>  
            <a href="#"> <i> <img src="Landing Page Assets/location.png" height="30px"> Find Nearest Branch Location </i> </h6>
            </a>
        </div>
    
    </div>
       
    

    <div class="Ads-Section">
            <h4> Get 20% off your first
             coffee - ONLY at Nightfeather.</h4>
            <h6> <i> *For a Limited time only* </i> </h6>
            <img src="Landing Page Assets/coffee.png" alt="cup of coffee">
            <h5> <i> Freshly brewed ● Locally loved ● Served daily </i> </h5> 
            
            <div class="socials"> 
                <a href="https://www.instagram.com/" target="_blank"> <img src="Landing Page Assets/instagram.png" alt="NightFeather Logo Black" class="Logo-Black" > </a>
                <a href="https://www.facebook.com/" target="_blank"> <img src="Landing Page Assets/facebook.png" alt="NightFeather Logo Black" class="ig" > </a>
                <a href="https://www.tiktok.com/" target="_blank"> <img src="Landing Page Assets/tiktok.png" alt="NightFeather Logo Black" class="tt"> </a>
           </div>
       
    </div>
